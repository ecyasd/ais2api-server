name: Prepare worker idle retention

on:
  push:
    branches: [fix/server-review-followups]
    paths: [.github/workflows/worker-idle-configuration.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'ecyasd/ais2api-server' && github.ref == 'refs/heads/fix/server-review-followups'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Apply bounded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('internal/app/worker_manager.go')
          raw = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '8c53a2bd47e4955ffd2d848f95f41cfdcdebf704', 'worker source changed; review before retry'
          source = raw.decode()
          replacements = [
              ('\tinitTimeout    time.Duration\n', '\tinitTimeout    time.Duration\n\tidleAfter      time.Duration\n', 1),
              ('\t\tglobalProxy: globalProxy, initTimeout: initTimeout,', '\t\tglobalProxy: globalProxy, initTimeout: initTimeout, idleAfter: configuredWorkerIdleTimeout(),', 1),
              ('const workerIdleTimeout = 5 * time.Minute', 'const workerIdleTimeout = 30 * time.Minute', 1),
              ('time.Now().Add(-workerIdleTimeout)', 'time.Now().Add(-manager.idleTimeout())', 2),
              ('time.NewTicker(workerIdleTimeout / 10)', 'time.NewTicker(workerIdleCheckInterval(manager.idleTimeout()))', 1),
          ]
          for old, new, count in replacements:
              assert source.count(old) == count, old
              source = source.replace(old, new)
          path.write_text(source)
          Path('internal/app/worker_idle_policy.go').write_text('''package app

          import (
              "log/slog"
              "os"
              "strings"
              "time"
          )

          // WORKER_IDLE_TIMEOUT is a process environment setting. It is read when
          // a generation service creates its worker manager. It does not remove
          // credentials or lower WARM_WORKER_LIMIT; only surplus idle workers expire.
          func configuredWorkerIdleTimeout() time.Duration {
              value, present := os.LookupEnv("WORKER_IDLE_TIMEOUT")
              if !present {
                  return workerIdleTimeout
              }
              duration, err := time.ParseDuration(strings.TrimSpace(value))
              if err != nil || duration < time.Second {
                  // Do not echo environment contents into logs.
                  slog.Warn("WORKER_IDLE_TIMEOUT must be a duration of at least 1s; using 30m")
                  return workerIdleTimeout
              }
              return duration
          }

          func (manager *accountWorkerManager) idleTimeout() time.Duration {
              if manager.idleAfter < time.Second {
                  return workerIdleTimeout
              }
              return manager.idleAfter
          }

          // A long retention period must not also delay capacity-shrink checks.
          func workerIdleCheckInterval(retention time.Duration) time.Duration {
              return min(30*time.Second, max(time.Second, retention/10))
          }
          ''')
          Path('internal/app/worker_idle_policy_test.go').write_text('''package app

          import (
              "os"
              "testing"
              "time"
          )

          func TestWorkerIdleTimeoutConfiguration(t *testing.T) {
              original, existed := os.LookupEnv("WORKER_IDLE_TIMEOUT")
              t.Cleanup(func() {
                  if existed {
                      _ = os.Setenv("WORKER_IDLE_TIMEOUT", original)
                  } else {
                      _ = os.Unsetenv("WORKER_IDLE_TIMEOUT")
                  }
              })
              _ = os.Unsetenv("WORKER_IDLE_TIMEOUT")
              if got := configuredWorkerIdleTimeout(); got != 30*time.Minute {
                  t.Fatalf("unset retention = %s, want 30m", got)
              }
              for _, test := range []struct {
                  value string
                  want time.Duration
              }{
                  {"30m", 30*time.Minute},
                  {"10m", 10*time.Minute},
                  {" 1h ", time.Hour},
                  {"1s", time.Second},
                  {"", 30*time.Minute},
                  {"0", 30*time.Minute},
                  {"-1m", 30*time.Minute},
                  {"500ms", 30*time.Minute},
                  {"invalid", 30*time.Minute},
              } {
                  t.Run(test.value, func(t *testing.T) {
                      t.Setenv("WORKER_IDLE_TIMEOUT", test.value)
                      manager := &accountWorkerManager{idleAfter: configuredWorkerIdleTimeout()}
                      if got := manager.idleTimeout(); got != test.want {
                          t.Fatalf("retention = %s, want %s", got, test.want)
                      }
                  })
              }
          }

          func TestWorkerIdleRetentionBoundaries(t *testing.T) {
              manager := &accountWorkerManager{idleAfter: 30*time.Minute}
              now := time.Date(2026, 1, 1, 1, 0, 0, 0, time.UTC)
              cutoff := now.Add(-manager.idleTimeout())
              if !now.Add(-29*time.Minute-59*time.Second).After(cutoff) {
                  t.Fatal("a worker idle less than 30 minutes became eligible")
              }
              if now.Add(-30*time.Minute).After(cutoff) {
                  t.Fatal("a worker idle exactly 30 minutes remained recent")
              }
              if got := workerIdleCheckInterval(manager.idleTimeout()); got != 30*time.Second {
                  t.Fatalf("poll interval = %s, want 30s", got)
              }
              if got := workerIdleCheckInterval(time.Second); got != time.Second {
                  t.Fatalf("short timeout poll interval = %s", got)
              }
          }

          func TestIdleReaperKeepsWarmFloor(t *testing.T) {
              account := &accountWorker{id: "synthetic-warm-account"}
              account.warm.Store(true)
              manager := &accountWorkerManager{
                  accounts: map[string]*accountWorker{account.id: account},
                  openings: make(map[string]chan struct{}),
                  idleAfter: 30*time.Minute,
              }
              manager.warmTarget.Store(1)
              manager.maxActive.Store(4)
              // Even a very old idle cutoff must not evict the final warm worker.
              if manager.reapIdleWorker(time.Now().Add(time.Hour)) {
                  t.Fatal("the last warm worker was reaped")
              }
              if !account.warm.Load() {
                  t.Fatal("the last warm worker was marked cold")
              }
          }
          ''')
          path = Path('deploy/compose.server.yml')
          source = path.read_text()
          anchor = '    environment:\n'
          assert source.count(anchor) == 1
          path.write_text(source.replace(anchor, anchor + '      WORKER_IDLE_TIMEOUT: "${WORKER_IDLE_TIMEOUT:-30m}"\n'))
          path = Path('deploy/server.env.example')
          source = path.read_text()
          assert source.count('AUTO_START=false') == 1
          path.write_text(source.replace('AUTO_START=false', 'AUTO_START=true'))
          Path('docs/worker-retention.md').write_text('''# Server worker retention

          The server keeps one prepared account by default and may expand to four active
          workers. The idle reaper closes **surplus** workers after 30 minutes without
          use. It never reduces the warm pool below `WARM_WORKER_LIMIT`, never deletes
          an account or its cookies, and retains the existing busy-worker/lease checks.
          Capacity pressure, authentication failure, explicit stop or a reduced active
          limit can still replace/close a worker before the idle timeout.

          `WORKER_IDLE_TIMEOUT=30m` overrides this retention. It accepts Go durations
          of at least one second; missing or invalid values use 30 minutes. This is a
          **process environment** setting, not a management-form or `/data/.env` key.
          Do not put it in the application-managed `.env`: unknown keys are removed
          when settings are saved. Compose passes it into the container explicitly.
          For the fixed host deployment, set it in `/etc/ais2api-server/image.env`
          (the Compose interpolation environment), then recreate the service container.
          For a directly executed binary, export it before starting the process.
          The reaper checks at most every 30 seconds; expiry does not imply execution
          at an exact wall-clock instant.

          Recommended application settings in persistent `/data/.env`:

          ```dotenv
          AUTO_START=true
          WAA_BACKEND=spidermonkey
          WARM_WORKER_LIMIT=1
          MAX_ACTIVE_WORKERS=4
          WARM_STARTUP_CONCURRENCY=4
          ```

          Existing saved settings are not overwritten by an image upgrade. Apply the
          above non-secret settings via management or the private host configuration,
          preserving administrator credentials, API keys and all account directories.
          Update the root-owned host updater separately to include PR #6 fixes.
          The final warm account is retained, including after 30 idle minutes.
          PG and Build still use the local SpiderMonkey path, not a remote signer.
          ''')
          # This one-shot preparation workflow is not retained in the final PR tree.
          Path('.github/workflows/worker-idle-configuration.yml').unlink()
          PY
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and commit only to the review branch
        shell: bash
        run: |
          gofmt -w internal/app/worker_manager.go internal/app/worker_idle_policy.go internal/app/worker_idle_policy_test.go
          git diff --check
          git add internal/app/worker_manager.go internal/app/worker_idle_policy.go internal/app/worker_idle_policy_test.go deploy/compose.server.yml deploy/server.env.example docs/worker-retention.md .github/workflows/worker-idle-configuration.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Make surplus worker retention configurable with a 30-minute default'
          git push origin HEAD:refs/heads/fix/server-review-followups
